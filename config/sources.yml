# ─────────────────────────────────────────────────────────────
# jjam-agent — AI·개발 브리핑 소스 목록
#
# scripts/collect-news.py 가 읽는다. 각 소스는 아래 필드를 가진다:
#   id        : 고유 식별자(수집기가 피드 주소 해석에 사용)
#   name      : 사람이 읽는 이름(브리핑 출처 표기)
#   type      : official | docs | github-release | news | research | community
#   category  : 분류 태그
#   url        : 원문(사람이 보는) 페이지 주소
#   priority   : 1~10, 클수록 우선. top-N 선별과 대표 출처 선택에 사용
#
# 수집 방법은 수집기가 type/id 로 자동 결정한다:
#   - RSS/Atom 이 있는 소스 → 피드 수집(대다수)
#   - github-release        → releases.atom 수집
#   - RSS 없는 소스          → Brave Search(BRAVE_API_KEY 필요, 없으면 건너뜀)
# ─────────────────────────────────────────────────────────────

