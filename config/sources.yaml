# ─────────────────────────────────────────────────────────────
# jjam-agent — 뉴스 브리핑 RSS 소스 목록
#
# scripts/collect-news.py 가 읽는다.
# 구조는 "그룹 이름: (2칸 들여쓰기) - URL" 의 단순 리스트만 지원한다.
# (PyYAML 이 있으면 그걸로, 없으면 collect-news.py 의 내장 fallback
#  파서로 파싱한다. 아래 단순 구조 외의 YAML 문법은 쓰지 말 것.)
#
# 각 그룹 2~4개 유효 피드. 주석(#)과 빈 줄은 무시된다.
# ─────────────────────────────────────────────────────────────

# ① AI · IT 종합 뉴스
ai_it:
  - https://hnrss.org/frontpage
  - https://www.theregister.com/headlines.atom
  - https://github.blog/feed/
  - https://feeds.arstechnica.com/arstechnica/technology-lab

# ② Java · OpenJDK
java_openjdk:
  - https://mail.openjdk.org/pipermail/announce/feed.xml
  - https://inside.java/feed.xml
  - https://blogs.oracle.com/java/rss

# ③ Spring
spring:
  - https://spring.io/blog.atom
  - https://spring.io/blog/category/releases.atom

# ④ 백엔드 · 클라우드 · 보안
backend_cloud_security:
  - https://www.infoq.com/feed/
  - https://aws.amazon.com/blogs/aws/feed/
  - https://kubernetes.io/feed.xml
  - https://krebsonsecurity.com/feed/
