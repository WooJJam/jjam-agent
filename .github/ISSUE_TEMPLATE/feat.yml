name: "✨ 기능 (feat)"
description: "새 기능·스크립트·스킬 추가"
title: "[feat] "
labels: ["feat"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경 / 목적
      description: 왜 이 작업이 필요한가? 어떤 문제·불편을 해결하는가?
      placeholder: 예) 결제일에 계좌 잔액이 충분한지 한눈에 판정할 수단이 없다.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      description: 체크리스트로 작성한다. PR 작성 시 이 목록과 대조된다.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇이 확인되면 완료인가? 검증 방법(실행 명령·기대 출력)을 포함한다.
      placeholder: 예) 더미 데이터 시드 후 finance-check.py 실행 시 1:N 판정 표가 정확히 출력된다.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      options:
        - finance
        - briefing
        - weather
        - cost-usage
        - hermes
        - workflow
        - 공통
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 참고
      description: "스펙 문서 절·관련 이슈·외부 문서 (예: docs/FINANCE_SPEC.md §5, #12)"
    validations:
      required: false
