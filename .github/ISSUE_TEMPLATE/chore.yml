name: "🔧 잡무 (chore)"
description: "설정·의존성·정리 등 기능 외 작업"
title: "[chore] "
labels: ["chore"]
body:
  - type: textarea
    id: what
    attributes:
      label: 작업 내용
      description: 무엇을 하는가?
      placeholder: "예: pre-commit 시크릿 스캔 훅 추가"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 이유
      description: 왜 필요한가? 안 하면 어떤 문제가 있는가?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 확인 방법 (선택)
    validations:
      required: false
