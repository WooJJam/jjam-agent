name: "📄 문서 (docs)"
description: "스펙·계획·운영 문서 작성/수정"
title: "[docs] "
labels: ["docs"]
body:
  - type: input
    id: target
    attributes:
      label: 대상 문서
      description: 새로 만들거나 수정할 문서 경로
      placeholder: "예: docs/FINANCE_SPEC.md"
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 변경 내용
      description: 무엇을 추가·수정·삭제하는가? 결정 사항이면 결정의 근거도 함께.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      options:
        - finance
        - briefing
        - weather
        - cost-usage
        - hermes
        - workflow
        - 공통
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 참고
      description: "관련 이슈·대화·외부 문서"
    validations:
      required: false
